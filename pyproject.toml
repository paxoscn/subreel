[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "subreel"
version = "0.1.0"
description = "Turn speech audio into subtitle reels: green-screen H.264, transparent WebM/ProRes, with word-by-word karaoke highlight."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [{ name = "paxoscn" }]
keywords = [
    "subtitles",
    "captions",
    "karaoke",
    "tts",
    "asr",
    "whisper",
    "ffmpeg",
    "ass",
    "green-screen",
    "chroma-key",
    "video",
    "cli",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "Topic :: Multimedia :: Video :: Non-Linear Editor",
]
dependencies = []

[project.optional-dependencies]
tts = ["edge-tts>=6"]
asr = ["faster-whisper>=1.0"]
dev = ["pytest"]

[project.scripts]
subreel = "subreel.cli:main"

[project.urls]
Homepage = "https://github.com/paxoscn/subreel"
Repository = "https://github.com/paxoscn/subreel"
Issues = "https://github.com/paxoscn/subreel/issues"
Changelog = "https://github.com/paxoscn/subreel/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]